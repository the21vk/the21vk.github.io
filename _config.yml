# Site configuration
# 1. Files excluded from Jekyll builds
# 2. Installed Gems
# 3. Gem settings
# 4. Jekyll settings
# 5. Collections
# 6. Jekyll collections settings
# 7. Site settings
# 8. Site favicons & manifest icons
# 9. Site navigation

# 1. Files excluded from Jekyll builds
exclude:
- README.md
- CODE_OF_CONDUCT.md
- CONTRIBUTING.md
- screenshot.png
- LICENSE
- CNAME
- Gemfile
- Gemfile.lock
- alembic-jekyll-theme.gemspec
- .jekyll-cache

# 2. Installed Gems
plugins:
- jekyll-sitemap
- jekyll-mentions
- jekyll-paginate
- jekyll-seo-tag
- jekyll-redirect-from
- jekyll-feed
- jekyll-commonmark
- jekyll-include-cache
- jemoji

# 3. Gem settings
paginate: 5 # jekyll-paginate > items per page
paginate_path: blog/page:num # jekyll-paginate > blog page
author: Vinay Kumar # jekyll-seo-tag > default author
social: # jekyll-seo-tag > social overrides
  name: Vinay Kumar # jekyll-seo-tag > real name
  links:  # jekyll-seo-tag > social aliases (sameAs)
    - https://github.com/the21vk
# markdown: CommonMark # Markdown parse settings, CommonMark performs slightly better an others in build time
# commonmark:
  # options: ["SMART", "FOOTNOTES"]
  # extensions: ["strikethrough", "autolink", "table"]

# 4. Jekyll settings
sass:
  style: compressed # Style compression
permalink: pretty  # Permalink style (/YYYY/MM/DD/page-name/)
excerpt_separator: <!-- more --> # Marks end of excerpt in posts
timezone: Asia/Kolkata # Timezone for blog posts and alike

# 5. Collections
collections:
  posts:
    title: Posts # Needed for Siteleaf
    output: true
    description: "Notes and occasional writing" # The post list page content
    feature_text: |
      Notes and occasional writing
    feature_image: "https://picsum.photos/2560/600?image=866"

# 6. Jekyll collections settings
defaults:
  -
    scope:
      path: ""
    values:
      image: "/assets/default-social-image.png" # Default image for sharing
  -
    scope:
      path: ""
      type: "posts"
    values:
      layout: post # Set the default layout for posts
  -
    scope:
      path: ""
      type: "pages"
    values:
      layout: page # Set the default layout for pages

# 7. Site settings
encoding: utf-8 # Make sure the encoding is right
lang: en-GB # Set the site language
title: "Vinay Kumar" # Site name or title, also used in jekyll-seo-tag
logo: "/assets/site_ico/android-chrome-192x192.png" # Site logo, also used in jekyll-seo-tag
description: "Personal website of Vinay Kumar, a PhD student working on computational astrophysics, magnetic reconnection, and astrophysical plasma dynamics." # Site description and default description, also used in jekyll-seo-tag
url: "https://the21vk.github.io" # Site url, also used in jekyll-seo-tag
baseurl: ""
repo: "https://github.com/the21vk/the21vk.github.io-new"
email: "the21vk@gmail.com"
# disqus: "alembic-1" # Blog post comments, uncomment the option and set the site ID from your Disqus account
# date_format: "%-d %B %Y" # Blog post date formatting using placeholder formatting
# google_analytics: ""
# google_analytics_anonymize_ip: ""
# service_worker: false # Will turn off the service worker if set to false
# short_name: "Al" # The web application short name, defaults to the site title
css_inline: true # Will insert all styles into a single <style> block in the <head> element and remove the style <link> reference
manifest:
  theme_color: "#08131f"
  background_color: "#08131f"

# 8. Site favicons & manifest icons
favicons: # Favicons are also used in the manifest file. Syntax is 'size: path'
  16: '/assets/site_ico/favicon-16x16.png'
  32: '/assets/site_ico/favicon-32x32.png'
  48: '/assets/site_ico/favicon-48x48.png'
  192: '/assets/site_ico/android-chrome-192x192.png'
  180: '/assets/site_ico/apple-touch-icon-180x180.png'
  512: '/assets/site_ico/android-chrome-512x512.png'

# 9. Site navigation
navigation_header:
- title: Home
  url: /
- title: Research
  url: /research/
- title: Publications
  url: /publications/
# - title: Misc Docs
#   url: /misc-docs/

navigation_footer:
- title: Email
  url: mailto:the21vk@gmail.com
- title: GitHub
  url: https://github.com/the21vk

social_links: # Appears in sidebar. Set the urls then uncomment and comment out as desired
  ORCID: https://orcid.org/0009-0008-2158-3774
  GitHub: https://github.com/the21vk
  Google Scholar: https://scholar.google.com/citations?user=7rpADBsAAAAJ&hl=en

sharing_links: # Appear at the bottom of single blog posts, add as desired. The value can be 'true' or the desired button colour
  Email: true

# Load custom fonts from fonts.google.com etc
#
# TIP: Try to keep the number of urls as low to reduce the performance cost
#      If multiple fonts can be requested in a single url opt for this
fonts:
  preconnect_urls:
    - https://fonts.gstatic.com
  font_urls:
    - https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&display=swap
