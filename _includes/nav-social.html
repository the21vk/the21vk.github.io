<nav class="nav  nav--social">
  {% for link in site.social_links %}
  {% if link[1] != blank %}
  {% assign id = link[0] | downcase | replace: " ", "-" %}
  {% assign link_title = link[0] %}
  <a href="{{ link[1] }}">
    {% include icon.html id=id title=link_title %}
  </a>
  {% endif %}
  {% endfor %}
</nav>
